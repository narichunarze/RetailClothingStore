bundle:
  name: andesmart-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog
    default: workspace
  schema:
    description: Target schema per environment
    default: andesmart_dev

targets:
  dev:
    mode: development
    default: true
    variables:
      schema: andesmart_dev

  prod:
    mode: production
    variables:
      schema: andesmart_prod
