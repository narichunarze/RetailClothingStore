bundle:
  name: andesmart-lakehouse

include:
  - resources/*.yml

# Wheel con la lógica de negocio (src/). dynamic_version agrega un sufijo único por deploy
# para que el entorno serverless no reutilice una versión cacheada.
artifacts:
  andesmart_lib:
    type: whl
    path: .
    build: python -m pip wheel --no-deps --wheel-dir dist .
    dynamic_version: true

variables:
  catalog:
    description: Unity Catalog catalog
    default: workspace
  schema:
    description: Schema destino por entorno
    default: andesmart_dev
  raw_path:
    description: >
      Landing zone con los archivos crudos. En Free Edition dev y prod leen la misma;
      con un cliente real cada entorno tendría la suya.
    default: /Volumes/workspace/andesmart_dev/raw
  reader_group:
    description: Grupo de negocio con acceso de solo lectura a las vistas semánticas
    default: account users
  schedule_status:
    description: PAUSED o UNPAUSED para el job diario
    default: PAUSED

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Los artefactos (wheel) van a un Volume de UC, no al sistema de archivos del workspace.
      artifact_path: /Volumes/workspace/andesmart_dev/artifacts/${workspace.current_user.short_name}
    variables:
      schema: andesmart_dev

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
      artifact_path: /Volumes/workspace/andesmart_prod/artifacts
    permissions:
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
    variables:
      schema: andesmart_prod
      # Free Edition tiene cuota: dejarlo en PAUSED y correr a mano; UNPAUSED para diario.
      schedule_status: PAUSED
