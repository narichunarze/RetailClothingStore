resources:
  jobs:
    andesmart_daily:
      name: andesmart-daily-${var.schema}
      description: Refresco diario del lakehouse, quality gate, forecast + reposición y capa semántica para Genie.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Lima
        # En target dev el bundle pausa los schedules automáticamente.
        pause_status: ${var.schedule_status}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      max_concurrent_runs: 1

      # Entorno serverless: instala el wheel del proyecto (construido por el bundle y
      # guardado en un Volume) en vez de importar archivos del workspace. Ver ADR-0004.
      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - ../dist/*.whl
              - scikit-learn==1.5.2
              - mlflow==2.19.0

      tasks:
        - task_key: refresh_medallion
          pipeline_task:
            pipeline_id: ${resources.pipelines.andesmart_medallion.id}

        - task_key: quality_gate
          max_retries: 1
          min_retry_interval_millis: 60000
          depends_on:
            - task_key: refresh_medallion
          environment_key: default
          python_wheel_task:
            package_name: andesmart_lakehouse
            entry_point: quality_gate
            named_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: forecast
          max_retries: 1
          min_retry_interval_millis: 60000
          depends_on:
            - task_key: quality_gate
          environment_key: default
          python_wheel_task:
            package_name: andesmart_lakehouse
            entry_point: forecast
            named_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              test_weeks: "8"

        - task_key: semantic_layer
          max_retries: 1
          min_retry_interval_millis: 60000
          depends_on:
            - task_key: forecast
          environment_key: default
          python_wheel_task:
            package_name: andesmart_lakehouse
            entry_point: semantic_layer
            named_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              reader_group: ${var.reader_group}
