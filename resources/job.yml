resources:
  jobs:
    andesmart_daily:
      name: andesmart-daily-${var.schema}
      description: Refresco diario del lakehouse, quality gate, forecast + reposición y capa semántica para Genie.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Lima
        # En target dev el bundle pausa los schedules automáticamente.
        pause_status: ${var.schedule_status}
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      max_concurrent_runs: 1
      # Las tareas de notebook reintentan una vez ante fallos transitorios (p. ej. I/O del workspace).
      tasks:
        - task_key: refresh_medallion
          pipeline_task:
            pipeline_id: ${resources.pipelines.andesmart_medallion.id}

        - task_key: quality_gate
          max_retries: 1
          min_retry_interval_millis: 60000
          depends_on:
            - task_key: refresh_medallion
          notebook_task:
            notebook_path: ../src/jobs/quality_gate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              bundle_root: ${workspace.file_path}

        - task_key: forecast
          max_retries: 1
          min_retry_interval_millis: 60000
          depends_on:
            - task_key: quality_gate
          max_retries: 1
          min_retry_interval_millis: 60000
          notebook_task:
            notebook_path: ../src/jobs/forecast.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              bundle_root: ${workspace.file_path}
              test_weeks: "8"

        - task_key: semantic_layer
          max_retries: 1
          min_retry_interval_millis: 60000
          depends_on:
            - task_key: forecast
          notebook_task:
            notebook_path: ../src/jobs/semantic_layer.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              bundle_root: ${workspace.file_path}
