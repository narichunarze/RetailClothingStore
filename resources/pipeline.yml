resources:
  pipelines:
    andesmart_medallion:
      name: andesmart-medallion-${var.schema}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      photon: true
      channel: CURRENT
      configuration:
        raw_path: ${var.raw_path}
        # Carpeta donde el bundle sincroniza el repo; permite `from src import transforms`.
        bundle_root: ${workspace.file_path}
      libraries:
        - glob:
            include: ../src/pipelines/**
